name: mon_budget
description: "Application de gestion des dépenses personnelles - FCFA"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de données locale (fonctionnement hors ligne)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Préférences utilisateur (thème, devise, sécurité)
  shared_preferences: ^2.3.2

  # Formatage des montants et dates
  intl: ^0.19.0

  # Graphiques statistiques
  fl_chart: ^0.68.0

  # Export CSV / partage de fichiers
  csv: ^6.0.0
  share_plus: ^10.0.2

  # Photo du reçu
  image_picker: ^1.1.2

  # Génération d'identifiants uniques
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
